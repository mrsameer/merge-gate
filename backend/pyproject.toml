[project]
name = "mergegate"
version = "0.1.0"
description = "MergeGate control plane: LangGraph orchestrator, LLM-free acceptance engine, and API"
authors = [
    { name = "mrsameer", email = "mrsameer@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.2",
    "gitpython>=3.1.55",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "sse-starlette>=3.4.6",
    "uvicorn>=0.51.0",
]

[project.scripts]
mergegate = "mergegate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
